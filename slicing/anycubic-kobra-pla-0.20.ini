# --- printer -------------------------------------------------------------
printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
single_extruder_multi_material = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
gcode_comments = 0
autoemit_temperature_commands = 0

start_gcode = M104 S{first_layer_temperature[0]}\nM140 S{first_layer_bed_temperature[0]}\nG21\nG90\nM82\nM190 S{first_layer_bed_temperature[0]}\nM109 S{first_layer_temperature[0]}\nG28\nM420 S1\nG92 E0\nG1 Z2.0 F3000\nG1 X20 Y2.0 Z0.28 F5000\nG1 X200 Y2.0 Z0.28 F1500 E15\nG1 X200 Y2.5 Z0.28 F5000\nG1 X20 Y2.5 Z0.28 F1500 E30\nG92 E0\nG1 Z2.0 F3000\nG1 X10 Y10 F5000
end_gcode = M104 S0\nM140 S0\nG92 E0\nG1 E-3 F1800\nG91\nG1 Z10 F3000\nG90\nG1 X10 Y210 F4000\nM107\nM84

# --- filament: PLA -------------------------------------------------------
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
extrusion_multiplier = 1
filament_density = 1.24
filament_cost = 20
filament_type = PLA
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
slowdown_below_layer_time = 8
min_print_speed = 15
cooling = 1

# --- retraction: Kobra is direct drive -----------------------------------
retract_length = 1.5
retract_speed = 35
deretract_speed = 30
retract_before_travel = 2
retract_lift = 0.2
retract_lift_below = 249
retract_restart_extra = 0
wipe = 1

# --- layers and shells ---------------------------------------------------
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
external_perimeter_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
support_material_extrusion_width = 0.38
thin_walls = 1
gap_fill_enabled = 1
elefant_foot_compensation = 0.2
external_perimeters_first = 0
seam_position = aligned

# --- infill --------------------------------------------------------------
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
infill_every_layers = 1
solid_infill_every_layers = 0
infill_anchor = 2.5
infill_anchor_max = 12

# --- supports: the back is convex, so the whole underside overhangs ------
support_material = 1
support_material_auto = 1
support_material_style = snug
support_material_threshold = 50
support_material_buildplate_only = 0
support_material_contact_distance = 0.2
support_material_bottom_contact_distance = 0.2
support_material_xy_spacing = 90%
support_material_interface_layers = 3
support_material_bottom_interface_layers = 2
support_material_interface_spacing = 0.3
support_material_interface_contact_loops = 0
support_material_spacing = 2.5
support_material_angle = 0
support_material_with_sheath = 0
dont_support_bridges = 1
support_tree_branch_diameter = 3
support_tree_angle = 40

# --- adhesion: first-layer contact is small on a curved underside --------
brim_type = outer_only
brim_width = 2
brim_separation = 0.1
skirts = 0

# --- speeds --------------------------------------------------------------
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 35
support_material_speed = 45
support_material_interface_speed = 80%
bridge_speed = 25
gap_fill_speed = 30
travel_speed = 150
travel_speed_z = 12
first_layer_speed = 20
first_layer_speed_over_raft = 20
max_print_speed = 100
perimeter_acceleration = 800
infill_acceleration = 1000
default_acceleration = 800
first_layer_acceleration = 500
travel_acceleration = 1000

# --- output --------------------------------------------------------------
complete_objects = 0
spiral_vase = 0

gcode_resolution = 0.05
resolution = 0.02
